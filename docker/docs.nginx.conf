# The documentation site: static files, and a single-page app's routing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /templates and the rest are routes inside the app, not folders on disk. Without
    # this, everything but the home page is a 404 on reload or on a shared link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so the contents cannot change under a cached copy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached: it is the file that names the current hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
